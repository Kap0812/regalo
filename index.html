<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}[hidden]{display:none!important}</style>
</head>
<body>
<title>Hasta el final del principio</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;1,300;1,400&family=IBM+Plex+Mono:wght@300;400&display=swap">
<style>
/* Layout: full-bleed canvas voyage, one quiet caption at the start, serif message at the end. Single deep-space look. */
:root{
  --void:#03040a;
  --ink:#eef0f7;
  --dim:#8d93ad;
  --rose:#ff7aa2;
  --rose-soft:#ffb6cb;
  --serif:"Cormorant Garamond","Iowan Old Style","Palatino Linotype",Georgia,serif;
  --mono:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  color-scheme:dark;
}
html,body{height:100%;}
body{background:var(--void);color:var(--ink);overflow:hidden;font-family:var(--mono);-webkit-tap-highlight-color:transparent;}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block;}

.cap{position:fixed;left:0;right:0;bottom:0;
  padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px));
  padding-bottom:calc(28px + env(safe-area-inset-bottom,0px));
  display:grid;gap:6px;pointer-events:none;transition:opacity 2s ease;}
.cap .n{font-family:var(--serif);font-style:italic;font-weight:300;font-size:clamp(28px,6vw,44px);line-height:1.05;}
.cap .s{font-size:12px;letter-spacing:.1em;color:var(--dim);font-variant-numeric:tabular-nums;}
.cap.off{opacity:0;}

.veil{position:fixed;inset:0;display:grid;place-items:center;text-align:center;
  padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px));
  background:radial-gradient(ellipse at center,rgba(3,4,10,.55),rgba(3,4,10,.2) 70%);
  transition:opacity 1.6s ease;}
.veil.off{opacity:0;pointer-events:none;}
.start{display:grid;gap:22px;justify-items:center;}
.start .k{font-size:11px;letter-spacing:.3em;text-transform:uppercase;color:var(--rose-soft);}
.start h1{margin:0;font-family:var(--serif);font-weight:300;font-style:italic;font-size:clamp(40px,10vw,72px);line-height:1;}
button{font:inherit;font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:var(--ink);
  background:rgba(3,4,10,.35);border:1px solid color-mix(in srgb,var(--rose) 60%,transparent);border-radius:999px;
  padding:14px 26px;cursor:pointer;transition:background .3s,border-color .3s;}
button:hover{background:color-mix(in srgb,var(--rose) 14%,transparent);border-color:var(--rose);}
button:focus-visible{outline:2px solid var(--rose-soft);outline-offset:4px;}

.msg{position:fixed;inset:0;display:grid;align-content:end;justify-items:center;text-align:center;gap:22px;
  padding-left:max(28px,env(safe-area-inset-left,0px));padding-right:max(28px,env(safe-area-inset-right,0px));
  padding-block:calc(24px + env(safe-area-inset-top,0px)) calc(9vh + env(safe-area-inset-bottom,0px));pointer-events:none;}
.msg p{margin:0;max-width:28ch;font-family:var(--serif);font-weight:300;font-size:clamp(20px,4.8vw,30px);line-height:1.32;text-wrap:balance;color:var(--ink);
  opacity:0;transform:translateY(10px);transition:opacity 3s ease,transform 3s ease;}
.msg h2{margin:0;max-width:15ch;font-family:var(--serif);font-weight:300;font-style:italic;font-size:clamp(38px,9.5vw,74px);line-height:1.04;text-wrap:balance;color:var(--rose-soft);
  opacity:0;transform:translateY(12px);transition:opacity 3.2s ease 3s,transform 3.2s ease 3s;}
.msg button{pointer-events:auto;margin-top:14px;opacity:0;transition:opacity 1.5s ease 8s;}
.msg.on p,.msg.on h2{opacity:1;transform:none;}
.msg.on button{opacity:1;}
.msg:not(.on) button{visibility:hidden;}
</style>

<canvas id="c" aria-hidden="true"></canvas>

<div class="cap off" id="cap">
  <div class="n">Cuautla, Morelos</div>
  <div class="s">18.81° N · 98.95° O</div>
</div>

<div class="msg" id="msg">
  <p>De todas las maravillas que fueron creadas en la inmensidad y lo infinito del espacio,</p>
  <h2>tú fuiste el prototipo de toda la belleza</h2>
  <button id="again" type="button">Ver otra vez</button>
</div>

<audio id="music" src="music.mp3" preload="auto" loop playsinline></audio>
<button id="mute" type="button" aria-label="Silenciar música" hidden>♪</button>
<style>
#mute{position:fixed;z-index:5;top:calc(14px + env(safe-area-inset-top,0px));right:max(14px,env(safe-area-inset-right,0px));
  width:40px;height:40px;padding:0;border-radius:50%;font-size:16px;letter-spacing:0;opacity:.55;transition:opacity .3s;}
#mute:hover{opacity:1}
#mute.off{text-decoration:line-through;opacity:.35}
</style>

<div class="veil" id="veil">
  <div class="start">
    <div class="k">Un viaje para ti</div>
    <h1>Desde aquí,<br>hasta todo</h1>
    <button id="go" type="button">Toca para empezar</button>
  </div>
</div>

const cv=document.getElementById('c'),ctx=cv.getContext('2d');
let W=0,H=0,DPR=1,U=1;

function rng(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;}}
const R=rng(20261024);
const gauss=()=>{let u=0,v=0;while(!u)u=R();while(!v)v=R();return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v);};

const D2R=Math.PI/180;

  for(let i=0;i<1100;i++){let x=(R()*2-1)*1.2,y=(R()*2-1)*1.1;g.beginPath();g.moveTo(o+x*sc,o+y*sc);
    for(let s=0;s<70;s++){const dx=A[0]-x,dy=A[1]-y,d=Math.hypot(dx,dy);if(d<.03)break;const sw=.55*Math.exp(-d*1.5);
      x+=(dx/d+sw*-dy/d)*.02;y+=(dy/d+sw*dx/d)*.02;g.lineTo(o+x*sc,o+y*sc);}
    g.strokeStyle='rgba(255,236,190,.055)';g.stroke();}
  for(let i=0;i<420;i++){const x=(R()*2-1)*1.2,y=(R()*2-1)*1.1,m=Math.pow(R(),3),s=4+m*20;g.globalAlpha=.12+.45*m;g.drawImage(spr(GOLD[i%4]),o+x*sc-s/2,o+y*sc-s/2,s,s);}
  g.globalAlpha=1;g.restore();
  g.globalCompositeOperation='lighter';path();g.strokeStyle='rgba(235,205,140,.75)';g.lineWidth=2.5;g.stroke();
  g.beginPath();g.moveTo(o-.2*sc,o-.8*sc);g.bezierCurveTo(o-.05*sc,o-.2*sc,o-.35*sc,o+.3*sc,o-.1*sc,o+.82*sc);g.strokeStyle='rgba(235,205,140,.35)';g.lineWidth=2;g.stroke();
  bloom(c,.45);return{c,ext,off:[.32,-.02]};})();

/* The observable universe: a sphere of galaxies with a glowing rim */
const UNI=(()=>{const px=1300,ext=1.18,sc=px/(2*ext),c=mk(px),g=c.getContext('2d'),o=px/2;
  const cols=['#8fa6ff','#a9b8ff','#e9d9b0','#ffffff','#f0c890','#b6c6ff'];g.globalCompositeOperation='lighter';
  for(let i=0;i<110000;i++){let x,y,z;do{x=R()*2-1;y=R()*2-1;z=R()*2-1;}while(x*x+y*y+z*z>1);
    const n=fbm(x*3+5,y*3,z*3+2,4);if(R()>.25+1.1*sstep(.42,.7,n))continue;
    g.globalAlpha=.15+.45*R();g.fillStyle=cols[Math.floor(R()*cols.length)];g.fillRect(o+x*sc,o+y*sc,1.3,1.3);}
  const cg=g.createRadialGradient(o,o,0,o,o,.5*sc);cg.addColorStop(0,'rgba(255,230,180,.22)');cg.addColorStop(1,'rgba(255,230,180,0)');g.globalAlpha=1;g.fillStyle=cg;g.fillRect(0,0,px,px);
  [[7,'rgba(160,190,255,.18)'],[3.5,'rgba(220,235,255,.55)'],[1.6,'rgba(255,255,255,.95)']].forEach(([w,col])=>{g.beginPath();g.arc(o,o,sc,0,7);g.strokeStyle=col;g.lineWidth=w;g.stroke();});
  for(let i=0;i<5;i++){const a0=R()*6.28;g.beginPath();g.arc(o,o,sc+1,a0,a0+.3+R()*.6);g.strokeStyle='rgba(240,200,120,.6)';g.lineWidth=2.4;g.stroke();}
  bloom(c,.9);return{c,ext};})();

/* ---------- Drawing ---------- */
let cx=0,cy=0;
function drawCloud(cl,k,alpha){
  ctx.globalCompositeOperation='lighter';
  for(const bk of cl.list){ctx.fillStyle=bk.c;const p=bk.p;
    for(let i=0;i<p.length;i+=4){const x=cx+p[i]*k,y=cy+p[i+1]*k;if(x<-4||y<-4||x>W+4||y>H+4)continue;
      ctx.globalAlpha=alpha*p[i+3];const s=p[i+2];ctx.fillRect(x-s/2,y-s/2,s,s);}}
  ctx.globalAlpha=1;ctx.globalCompositeOperation='source-over';
}
function glow(x,y,r,col,a){if(a<=0||r<=0)return;const g=ctx.createRadialGradient(x,y,0,x,y,r);g.addColorStop(0,col);g.addColorStop(1,'rgba(0,0,0,0)');
  ctx.globalAlpha=a;ctx.fillStyle=g;ctx.beginPath();ctx.arc(x,y,r,0,7);ctx.fill();ctx.globalAlpha=1;}
function orbit(ox,oy,r,a){ctx.globalAlpha=a;ctx.strokeStyle='rgba(170,185,230,.14)';ctx.lineWidth=1;ctx.beginPath();ctx.arc(ox,oy,r,0,7);ctx.stroke();ctx.globalAlpha=1;}
function planet(x,y,r,c,a){ctx.globalAlpha=a;ctx.fillStyle=c;ctx.beginPath();ctx.arc(x,y,Math.max(r,1.2),0,7);ctx.fill();ctx.globalAlpha=1;}

function drawEarth(rp,T){
  const diag=Math.hypot(W,H);
  const va=sstep(.7*diag,1.5*diag,rp);
  if(rp<2*diag){glow(cx,cy,rp*1.22,'rgba(110,170,255,.5)',.85*(1-va));
    ctx.imageSmoothingQuality='high';ctx.drawImage(earth,cx-rp,cy-rp,rp*2,rp*2);}
  if(va<=0)return;
  ctx.globalAlpha=va;ctx.fillStyle='#061024';
  if(rp>diag)ctx.fillRect(0,0,W,H);else{ctx.beginPath();ctx.arc(cx,cy,rp,0,7);ctx.fill();}
  ctx.fillStyle='#121d38';ctx.strokeStyle='rgba(120,150,215,.22)';ctx.lineWidth=1;
  for(const r of COAST){
    let minx=1e9,maxx=-1e9,miny=1e9,maxy=-1e9;
    ctx.beginPath();for(let i=0;i<r.length;i+=2){const x=cx+r[i]*rp,y=cy+r[i+1]*rp;
      if(x<minx)minx=x;if(x>maxx)maxx=x;if(y<miny)miny=y;if(y>maxy)maxy=y;i?ctx.lineTo(x,y):ctx.moveTo(x,y);}
    if(maxx<0||minx>W||maxy<0||miny>H)continue;ctx.closePath();ctx.fill();ctx.stroke();}
  // sodium haze over each city
  ctx.globalCompositeOperation='lighter';
  for(const h of HAZE){if(h[2]<=0)continue;const r=h[3]*rp;if(r<1.5)continue;const x=cx+h[0]*rp,y=cy+h[1]*rp;if(x+r<0||y+r<0||x-r>W||y-r>H)continue;
    glow(x,y,Math.min(r,diag*1.5),'rgba(255,160,70,'+(h[4]*.55)+')',va);}
  ctx.globalCompositeOperation='source-over';
  ctx.globalCompositeOperation='lighter';
  const grow=clamp(Math.log(rp/diag)/Math.log(40),0,1),lf=clamp(Math.pow(rp/(diag*40),.45),.22,.8);
  for(let i=0;i<LN;i++){const a=lights.a[i];if(a<.02||lights.z[i]<=0)continue;
    const x=cx+lights.x[i]*rp,y=cy+lights.y[i]*rp;if(x<-3||y<-3||x>W+3||y>H+3)continue;
    const tw=.8+.2*Math.sin(T*2.1+i);ctx.globalAlpha=va*a*tw*lf;ctx.fillStyle=LCOL[lights.c[i]];
    const s=lights.s[i]*(1+.5*grow);ctx.fillRect(x-s/2,y-s/2,s,s);}
  ctx.globalAlpha=1;ctx.globalCompositeOperation='source-over';
}

function sphere(x,y,r,col,lx,ly,a){r=Math.max(r,1.1);const g=ctx.createRadialGradient(x+lx*r*.5,y+ly*r*.5,r*.05,x,y,r*1.02);
  g.addColorStop(0,'#ffffff');g.addColorStop(.12,col);g.addColorStop(.62,col);g.addColorStop(1,'rgba(3,4,10,1)');
  ctx.globalAlpha=a;ctx.fillStyle=g;ctx.beginPath();ctx.arc(x,y,r,0,7);ctx.fill();ctx.globalAlpha=1;}
function lit(px,py,sx,sy){const dx=sx-px,dy=sy-py,d=Math.hypot(dx,dy)||1;return[dx/d,dy/d];}
function sun(x,y,r,a){glow(x,y,r*8,'rgba(255,214,160,.16)',a);glow(x,y,r*3,'rgba(255,240,215,.6)',a);
  ctx.globalAlpha=a;ctx.globalCompositeOperation='lighter';const s=r*4;ctx.drawImage(spr('#fff6e6'),x-s/2,y-s/2,s,s);ctx.globalCompositeOperation='source-over';ctx.globalAlpha=1;}
function starAt(x,y,size,col,a){ctx.globalAlpha=a;ctx.drawImage(spr(col),x-size/2,y-size/2,size,size);}
function ell(x,y,rx,ry,a,col,w){if(a<=0||rx<1)return;ctx.globalAlpha=a;ctx.strokeStyle=col||'rgba(245,240,230,.55)';ctx.lineWidth=w||1;ctx.beginPath();ctx.ellipse(x,y,rx,ry,0,0,6.2832);ctx.stroke();ctx.globalAlpha=1;}
function dashed(x,y,r,a){if(a<=0)return;ctx.globalAlpha=a;ctx.strokeStyle='rgba(255,255,255,.75)';ctx.lineWidth=1.2;ctx.setLineDash([6,6]);ctx.beginPath();ctx.arc(x,y,r,0,6.2832);ctx.stroke();ctx.setLineDash([]);ctx.globalAlpha=1;}

/* Planets in stage-3 units (the third planet is ours; it sits at the origin) */
const F=7,RE=.62;
const PL=[[.05,'#b3a79a',.006,1.1],[.075,'#e8d3a6',.009,2.4],[RE/F,'#7aa6e8',.009,0],[.135,'#c87a54',.007,3.6],[.36,'#d8b88f',.03,.6],[.58,'#e5d3a3',.025,2.2],[.82,'#b2dde3',.016,4.1],[1.06,'#6f8ae6',.016,5.3]];
const OM=PL.map(p=>.05*Math.pow((RE/F)/p[0],1.5));
const thE=T=>.9+.05*T;
const angP=(j,T)=>j===2?thE(T):PL[j][3]+OM[j]*T;
const sunS2=T=>[-RE*Math.cos(thE(T)),-RE*Math.sin(thE(T))*TY];   // Sun position in stage-2 units

function drawStage(i,k,a,T){
  switch(i){
  case 0:drawEarth(.55*k,T);break;
  case 1:{const an=-.5+T*.02;ell(cx,cy,k,k*TY,a*.7);const mx=cx+Math.cos(an)*k,my=cy+Math.sin(an)*k*TY;sphere(mx,my,.03*k,'#b9b7b2',-.85,-.27,a);break;}
  case 2:{const s=sunS2(T),sx=cx+s[0]*k,sy=cy+s[1]*k;sun(sx,sy,.045*k,a);
    for(let j=0;j<4;j++){const r=PL[j][0]*F*k,an=angP(j,T);ell(sx,sy,r,r*TY,a*.8);
      if(j===2)continue;const px=sx+Math.cos(an)*r,py=sy+Math.sin(an)*r*TY,l=lit(px,py,sx,sy);sphere(px,py,PL[j][2]*F*k,PL[j][1],l[0],l[1],a);}
    break;}
  case 3:{const s=sunS2(T),sx=cx+s[0]/F*k,sy=cy+s[1]/F*k,d=Math.log(U/k)/Math.log(F);
    const L=11*Math.pow(sstep(-.15,1.5,d),1.3),oa=1-.8*sstep(.2,1.2,d);
    for(let j=0;j<8;j++){const r=PL[j][0]*k,an=angP(j,T);ell(sx,sy,r,r*TY,a*.8*oa);
      const px=sx+Math.cos(an)*r,py=sy+Math.sin(an)*r*TY,l=lit(px,py,sx,sy),pr=Math.max(1.3,PL[j][2]*k);
      if(j===5){ctx.globalAlpha=a*.6;ctx.strokeStyle='#e0cf9f';ctx.lineWidth=Math.max(.7,pr*.4);ctx.beginPath();ctx.ellipse(px,py,pr*2.1,pr*.6,-.2,0,6.2832);ctx.stroke();ctx.globalAlpha=1;}
      sphere(px,py,pr,PL[j][1],l[0],l[1],a);}
    sun(sx,sy,Math.max(2.2,.02*k),a);
    if(L>.01){ // the Sun travels and its planets draw helices behind it
      ctx.lineCap='round';
      const sl=L*k;const sg=ctx.createLinearGradient(sx,sy,sx,sy+sl);sg.addColorStop(0,'rgba(255,248,230,.9)');sg.addColorStop(1,'rgba(255,248,230,0)');
      ctx.globalAlpha=a;ctx.strokeStyle=sg;ctx.lineWidth=1.6;ctx.beginPath();ctx.moveTo(sx,sy);ctx.lineTo(sx,sy+sl);ctx.stroke();
      for(let j=0;j<8;j++){const r=PL[j][0],an=angP(j,T),N=Math.min(3.2,.36*Math.pow(1.06/r,.75)),wv=N*6.2832;
        const n=Math.min(1400,Math.ceil(L*N*40)+10),C=6;
        for(let c=0;c<C;c++){ctx.globalAlpha=a*.6*(1-c/C);ctx.strokeStyle='#f4efe4';ctx.lineWidth=j>3?1.1:.8;ctx.beginPath();
          for(let q=Math.floor(c*n/C);q<=Math.ceil((c+1)*n/C);q++){const sL=q/n*L,b=an-wv*sL;
            const x=sx+Math.cos(b)*r*k,y=sy+sL*k+Math.sin(b)*r*TY*k;q===Math.floor(c*n/C)?ctx.moveTo(x,y):ctx.lineTo(x,y);}
          ctx.stroke();}}
      ctx.globalAlpha=1;}
    break;}
  case 4:{const d=Math.log(U/k)/Math.log(F),Lt=2.6*sstep(-.9,.6,d),s=sunS2(T),sx=cx+s[0]/F/F*k,sy=cy+s[1]/F/F*k;
    if(Lt>0){ctx.globalAlpha=a;ctx.lineWidth=1.5;const n=160;
      const g=ctx.createLinearGradient(sx,sy,sx,sy+Lt*k);g.addColorStop(0,'rgba(255,246,222,.95)');g.addColorStop(1,'rgba(255,246,222,0)');ctx.strokeStyle=g;
      ctx.beginPath();for(let q=0;q<=n;q++){const v=q/n*Lt;const x=sx+Math.sin(v*14+T*.6)*.022*k*sstep(0,.15,v),y=sy+v*k;q?ctx.lineTo(x,y):ctx.moveTo(x,y);}ctx.stroke();
      ctx.globalCompositeOperation='lighter';starAt(sx,sy,10,'#e8ff9e',a);glow(sx,sy,14,'rgba(230,255,170,.35)',a);ctx.globalCompositeOperation='source-over';ctx.globalAlpha=1;}
    break;}
  case 5:{drawGal(milkyG,C5[0],C5[1],k,a);const gx=cx+C5[0]*k,gy=cy+C5[1]*k;
    ctx.save();ctx.shadowColor='rgba(240,200,100,.8)';ctx.shadowBlur=8;ell(gx,gy,RS*k,RS*TY*k,a*.95,'#e9c86c',1.6);ctx.restore();
    ctx.globalAlpha=a*.7;ctx.strokeStyle='#efd89a';ctx.lineWidth=1.1;ctx.beginPath();ctx.moveTo(gx,gy);ctx.lineTo(cx,cy);ctx.stroke();ctx.globalAlpha=1;
    ctx.globalCompositeOperation='lighter';starAt(cx,cy,9,'#ffe08a',a);ctx.globalCompositeOperation='source-over';break;}
  case 6:{const sd=2*stipple.ext*k;ctx.globalAlpha=a;ctx.drawImage(stipple.c,cx-sd/2,cy-sd/2,sd,sd);ctx.globalAlpha=1;
    const m=[C5[0]/F,C5[1]/F],an=[m[0]+.46,m[1]-.2];
    const trail=(p,dx,dy,len)=>{const x=cx+p[0]*k,y=cy+p[1]*k,g=ctx.createLinearGradient(x,y,x+dx*len*k,y+dy*len*k);g.addColorStop(0,'rgba(255,255,255,.85)');g.addColorStop(1,'rgba(255,255,255,0)');
      ctx.globalAlpha=a;ctx.strokeStyle=g;ctx.lineWidth=1.4;ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x+dx*len*k,y+dy*len*k);ctx.stroke();ctx.globalAlpha=1;};
    {const d=Math.log(U/k)/Math.log(F),tf=sstep(-.4,.4,d);trail(m,-.6,.8,.5*tf);trail(an,.8,-.6,.3*tf);}
    drawGal(milkyG,m[0],m[1],k,a,1/F);drawGal(androG,an[0],an[1],k,a,.15);break;}
  case 7:{ctx.globalCompositeOperation='lighter';
    for(let j=0;j<VIRGO.length;j+=4){const x=cx+VIRGO[j]*k,y=cy+VIRGO[j+1]*k;if(x<-40||y<-40||x>W+40||y>H+40)continue;
      const s=Math.max(2.5,.06*VIRGO[j+2]*k);starAt(x,y,s,GOLD[VIRGO[j+3]],a*Math.min(1,.35+VIRGO[j+2]*.3));}
    ctx.globalCompositeOperation='source-over';dashed(cx,cy,.17*k,a*.9);break;}
  case 8:{const s=2*LAN.ext*k,x=cx+LAN.off[0]*k-s/2,y=cy+LAN.off[1]*k-s/2;ctx.globalAlpha=a;ctx.drawImage(LAN.c,x,y,s,s);ctx.globalAlpha=1;dashed(cx,cy,.13*k,a*.85);break;}
  case 9:{const s=2*UNI.ext*k;ctx.globalAlpha=a;ctx.drawImage(UNI.c,cx-s/2,cy-s/2,s,s);ctx.globalAlpha=1;
    ell(cx,cy,5,5,a*.9,'rgba(255,235,190,.9)',1.2);ell(cx,cy,10,10,a*.6,'rgba(255,235,190,.7)',1);break;}
  }
}

/* ---------- The two of us, as a constellation ---------- */
const CIMG=new Image();CIMG.src=COUPLE.uri;
function drawCouple(ct,T){
  const S=Math.min(H*.46,W*.9),ox=W/2,oy=H*.04+S*.62,P=COUPLE.s,E=COUPLE.e;
  const at=(q,p)=>[cx+(ox+q[0]*S-cx)*p,cy+(oy+q[1]*S-cy)*p];
  const sk=sstep(3,6.5,ct);
  if(sk>0&&CIMG.complete&&CIMG.naturalWidth){const a0=COUPLE.img[0],a1=COUPLE.img[1];ctx.globalAlpha=sk*.6;
    ctx.drawImage(CIMG,ox+a0[0]*S,oy+a0[1]*S,(a1[0]-a0[0])*S,(a1[1]-a0[1])*S);ctx.globalAlpha=1;}
  const ba=0;
  if(ba>0){ctx.globalAlpha=ba;ctx.strokeStyle='rgba(222,150,168,.65)';ctx.lineWidth=1;ctx.setLineDash([5,5]);ctx.beginPath();
    COUPLE.b.forEach((q,i)=>{const x=ox+q[0]*S,y=oy+q[1]*S;i?ctx.lineTo(x,y):ctx.moveTo(x,y);});ctx.closePath();ctx.stroke();ctx.setLineDash([]);ctx.globalAlpha=1;}
  const lp=clamp((ct-2.2)/3.2,0,1)*E.length;
  if(lp>0){ctx.strokeStyle='rgba(150,214,214,.85)';ctx.lineWidth=1.3;ctx.beginPath();
    for(let j=0;j<E.length&&j<lp;j++){const a=P[E[j][0]],b=P[E[j][1]],f=Math.min(1,lp-j);
      ctx.moveTo(ox+a[0]*S,oy+a[1]*S);ctx.lineTo(ox+(a[0]+(b[0]-a[0])*f)*S,oy+(a[1]+(b[1]-a[1])*f)*S);}ctx.stroke();}
  ctx.globalCompositeOperation='lighter';
  P.forEach((q,i)=>{const p=sstep(.2+i*.08,2.4+i*.08,ct);if(p<=0)return;const e=p*p*(3-2*p),[x,y]=at(q,e);
    const twk=.88+.12*Math.sin(T*1.8+i*2.1),s=(6+q[2]*7)*twk;starAt(x,y,s,'#ffffff',p);});
  ctx.globalCompositeOperation='source-over';ctx.globalAlpha=1;
  const la=0;
  if(la>0){const word='NOSOTROS';ctx.font='500 13px "IBM Plex Mono", ui-monospace, monospace';ctx.fillStyle='rgba(240,242,250,'+(.9*la)+')';
    ctx.textBaseline='middle';const sp=7,ws=[...word].map(ch=>ctx.measureText(ch).width),tot=ws.reduce((s,w)=>s+w+sp,-sp);
    let x=ox+.02*S-tot/2;const y=oy+.13*S;ctx.shadowColor='rgba(3,4,10,.9)';ctx.shadowBlur=6;
    [...word].forEach((ch,i)=>{ctx.fillText(ch,x,y);x+=ws[i]+sp;});ctx.shadowBlur=0;}
}

/* ---------- Timeline: one continuous logarithmic zoom ---------- */
const ZEND=10.4,V=1/3.5,TA=4,TD=7;
let Z0=-3.4;
function z0(){return -Math.log((6371/32)*Math.min(W,H)/(.55*U))/Math.log(F);}
function zAt(t){const D=ZEND-Z0,TC=D/V-(TA+TD)/2,T=TA+TC+TD;
  if(t<=0)return Z0;
  if(t<TA)return Z0+.5*V/TA*t*t;
  if(t<TA+TC)return Z0+V*TA/2+V*(t-TA);
  if(t<T){const u=T-t;return ZEND-.5*V/TD*u*u;}
  return ZEND;}
const total=()=>{const D=ZEND-Z0;return D/V+(TA+TD)/2;};

let started=false,t0=0,shown=false;
const cap=document.getElementById('cap'),msg=document.getElementById('msg'),veil=document.getElementById('veil');

function frame(now){
  const T=now/1000;if(!started)Z0=z0();
  const t=started?T-t0:0;const z=started?zAt(t):Z0;
  ctx.setTransform(DPR,0,0,DPR,0,0);ctx.fillStyle='#03040a';ctx.fillRect(0,0,W,H);
  const end=sstep(ZEND-.55,ZEND,z);
  cx=W/2;cy=H*(.5-.23*end);
  const ba=(.25+.3*clamp(z/4,0,1))*(1-.6*end),sa=.9*sstep(1.2,2.5,z)*(1-sstep(4.15,4.85,z));
  {const s=Math.max(W,H)*1.1;ctx.globalAlpha=ba;ctx.drawImage(sky,(W-s)/2,(H-s)/2,s,s);ctx.globalCompositeOperation='lighter';
   for(let i=0;i<tw.length;i+=5){const f=.5+.5*Math.sin(T*1.1+tw[i+2]);starAt(tw[i]*W,tw[i+1]*H,5+5*tw[i+3],STARCOL[tw[i+4]],ba*tw[i+3]*f);}
   ctx.globalCompositeOperation='source-over';ctx.globalAlpha=1;}
  if(sa>0){const s=Math.hypot(W,H)*1.12*(1+.06*(z-2));ctx.save();ctx.globalAlpha=sa;ctx.translate(W/2,H/2);ctx.rotate(-1.25+.04*z);ctx.drawImage(dustSky,-s/2,-s/2,s,s);ctx.restore();ctx.globalAlpha=1;}
  for(let i=9;i>=0;i--){const d=z-i;
    let a=(d<0?(i===0?1:clamp(1+d,0,1)):clamp(1-(d-2.2)/1.2,0,1))*(1-end);if(i===5)a*=sstep(-.5,-.05,d);if(a<=.01)continue;
    const k=U*Math.pow(F,-d);if(i>0&&k>U*F*1.05)continue;
    drawStage(i,k,a,T);}
  const ct=started?t-(total()-4):-1,cf=1-.85*sstep(0,3,ct);
  if(z>ZEND-1){const c=sstep(ZEND-1,ZEND-.2,z)*cf;const p=1+.12*Math.sin(T*1.4);
    glow(cx,cy,(18+40*c)*p,'rgba(255,205,225,.85)',c*.9);glow(cx,cy,4+3*c,'rgba(255,255,255,1)',c);}
  if(ct>0)drawCouple(ct,T);
  if(started&&!shown&&ct>7.8){shown=true;msg.classList.add('on');}
  if(started&&t>4.5)cap.classList.add('off');
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

function start(){Z0=z0();started=true;shown=false;t0=performance.now()/1000;veil.classList.add('off');msg.classList.remove('on');cap.classList.remove('off');
  try{navigator.wakeLock&&navigator.wakeLock.request('screen').catch(()=>{});}catch(e){}
  playMusic();}
/* Music: plays music.mp3 from the same folder, if it exists */
const music=document.getElementById('music'),mute=document.getElementById('mute');let fadeId=0,muted=false;
function fadeTo(v,ms){cancelAnimationFrame(fadeId);const v0=music.volume,t0=performance.now();
  const step=n=>{const p=Math.min(1,(n-t0)/ms);music.volume=v0+(v-v0)*p;if(p<1)fadeId=requestAnimationFrame(step);};fadeId=requestAnimationFrame(step);}
function playMusic(){try{music.currentTime=0;music.volume=0;const p=music.play();
  if(p&&p.then)p.then(()=>{mute.hidden=false;if(!muted)fadeTo(.85,3000);}).catch(()=>{});}catch(e){}}
music.addEventListener('error',()=>{mute.hidden=true;});
mute.addEventListener('click',()=>{muted=!muted;mute.classList.toggle('off',muted);mute.setAttribute('aria-label',muted?'Activar música':'Silenciar música');fadeTo(muted?0:.85,600);});
document.getElementById('go').addEventListener('click',start);
document.getElementById('again').addEventListener('click',start);
})();
</script>
